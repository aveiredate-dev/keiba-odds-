<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地方競馬 オッズ下降モニター</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
       background: #f5f4ef; color: #1a1a18; font-size: 14px; padding: 16px; max-width: 900px; margin: 0 auto; }
h1 { font-size: 16px; font-weight: 500; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.sec { font-size: 11px; font-weight: 500; color: #888; letter-spacing:.05em; margin: 12px 0 5px; }
.card { background:#fff; border-radius:12px; padding:14px 16px; margin-bottom:10px; border:0.5px solid rgba(0,0,0,0.1); }

/* レース選択 */
.date-row { display:flex; gap:8px; align-items:center; margin-bottom:12px; }
.date-row input[type=date] { font-size:13px; padding:5px 8px; border:0.5px solid #ccc; border-radius:8px; height:34px; }
.btn-sm { font-size:12px; padding:4px 12px; border-radius:8px; border:0.5px solid #85B7EB; background:#E6F1FB; color:#185FA5; cursor:pointer; height:30px; }
.btn-sm:hover { opacity:0.85; }

.venue-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
.venue-tab { font-size:13px; padding:6px 14px; border-radius:99px; border:0.5px solid #ccc; cursor:pointer; background:#fff; color:#666; }
.venue-tab.active { background:#1a1a18; color:#fff; border-color:#1a1a18; font-weight:500; }

.race-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(130px,1fr)); gap:8px; }
.race-card { background:#f5f4ef; border-radius:10px; padding:10px 12px; cursor:pointer; border:1.5px solid transparent; transition:all .15s; }
.race-card:hover { background:#fff; border-color:#ccc; }
.race-card.active { background:#fff; border-color:#1a1a18; }
.race-card.done { opacity:0.45; }
.race-card .rno { font-size:11px; color:#888; margin-bottom:2px; }
.race-card .rtime { font-size:18px; font-weight:500; color:#1a1a18; }
.race-card .rname { font-size:10px; color:#888; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.race-card.special .rtime { color:#185FA5; }
.race-card.special .rno::after { content:'特'; font-size:9px; background:#E6F1FB; color:#185FA5; padding:1px 4px; border-radius:3px; margin-left:4px; }

/* 式別 */
.bet-tabs { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:10px; }
.bet-tab { font-size:12px; padding:4px 12px; border-radius:99px; border:0.5px solid #ccc; cursor:pointer; background:transparent; color:#666; }
.bet-tab.active { background:#E6F1FB; color:#185FA5; border-color:#85B7EB; font-weight:500; }

.filter-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
.filter-row label { font-size:12px; color:#666; }
select { font-size:13px; padding:4px 8px; border:0.5px solid #ccc; border-radius:8px; background:#fff; color:#1a1a18; height:32px; }

/* タイマー */
.timer-row { display:flex; gap:8px; flex-wrap:wrap; }
.timer-block { flex:1; min-width:80px; text-align:center; padding:10px; background:#f5f4ef; border-radius:8px; }
.timer-label { font-size:10px; color:#888; margin-bottom:3px; }
.timer-val { font-size:20px; font-weight:500; font-variant-numeric:tabular-nums; }
.timer-val.warn { color:#BA7517; }
.timer-val.alrt { color:#A32D2D; }
.timer-val.done { color:#3B6D11; }

/* ボタン */
.btn-row { display:flex; gap:8px; margin-bottom:10px; }
.btn { flex:1; font-size:13px; height:40px; border-radius:10px; cursor:pointer; font-weight:500; border:0.5px solid #ccc; background:#fff; color:#333; }
.btn:hover:not(:disabled) { opacity:.85; }
.btn:disabled { opacity:.35; cursor:default; }
.btn.start { background:#EAF3DE; color:#27500A; border-color:#97C459; }
.btn.stop  { background:#FCEBEB; color:#791F1F; border-color:#F09595; }
.btn.now   { background:#E6F1FB; color:#185FA5; border-color:#85B7EB; }

.status { font-size:12px; padding:7px 12px; border-radius:8px; margin-bottom:10px; }
.s-idle { background:#f5f4ef; color:#888; }
.s-run  { background:#EAF3DE; color:#27500A; }
.s-err  { background:#FCEBEB; color:#A32D2D; }

.alert-banner { display:none; padding:10px 14px; border-radius:10px; margin-bottom:10px; background:#FCEBEB; border:1px solid #F09595; }
.alert-banner.show { display:block; }
.alert-banner .at { font-size:13px; font-weight:500; color:#791F1F; margin-bottom:3px; }
.alert-banner .al { font-size:12px; color:#A32D2D; line-height:1.8; }

.race-name { font-size:14px; font-weight:500; margin-bottom:2px; }
.race-meta { font-size:11px; color:#888; margin-bottom:8px; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { text-align:left; padding:5px 8px; color:#888; font-weight:500; border-bottom:0.5px solid rgba(0,0,0,0.1); font-size:11px; white-space:nowrap; }
td { padding:8px; border-bottom:0.5px solid rgba(0,0,0,0.06); vertical-align:middle; }
tr:hover td { background:#f9f8f4; }
tr.ar td { background:#FFF5F5; }
tr.ar td.hl { color:#A32D2D; font-weight:500; }
.badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:99px; font-weight:500; }
.bd  { background:#EAF3DE; color:#3B6D11; }
.bda { background:#3B6D11; color:#fff; }
.pd  { color:#3B6D11; font-size:12px; }
.pda { color:#27500A; font-size:12px; font-weight:500; }
.nb { display:inline-block; min-width:22px; height:22px; border-radius:4px; background:#f0efe9; text-align:center; line-height:22px; font-size:11px; color:#888; padding:0 3px; }
.nb.a { background:#FCEBEB; color:#A32D2D; }
.spark { display:flex; gap:2px; align-items:flex-end; height:22px; }
.sb { width:6px; border-radius:2px 2px 0 0; }
.empty { text-align:center; color:#888; padding:24px 0; font-size:13px; }

/* グラフモーダル */
.modal-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center; }
.modal-overlay.show { display:flex; }
.modal-box { background:#fff; border-radius:16px; padding:20px; width:90%; max-width:560px; }
.modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.modal-title { font-size:15px; font-weight:500; }
.modal-close { font-size:20px; cursor:pointer; color:#888; background:none; border:none; padding:0 4px; }
.modal-meta { font-size:11px; color:#888; margin-bottom:12px; }
.chart-wrap { position:relative; height:220px; }
.hot-badge { display:inline-block; background:#A32D2D; color:#fff; font-size:11px; padding:2px 8px; border-radius:99px; margin-left:6px; animation:hotpulse 1s infinite; }
@keyframes hotpulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
.hot-row td { background:#FFF0F0 !important; }
.hot-row td.hl { color:#A32D2D; font-weight:500; }


/* 履歴パネル */
.history-toggle { font-size:12px; padding:4px 12px; border-radius:8px; border:0.5px solid #ccc;
  background:#fff; color:#666; cursor:pointer; margin-bottom:10px; }
.history-toggle:hover { background:#f5f4ef; }
.history-panel { display:none; }
.history-panel.show { display:block; }
.history-item { background:#fff; border-radius:10px; padding:12px 14px; margin-bottom:8px;
  border:0.5px solid rgba(0,0,0,0.1); }
.history-item .hi-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.history-item .hi-title { font-size:13px; font-weight:500; }
.history-item .hi-date { font-size:11px; color:#888; }
.history-item .hi-signals { font-size:12px; color:#A32D2D; margin-bottom:6px; line-height:1.8; }
.history-item .hi-result { display:flex; gap:6px; align-items:center; margin-top:6px; }
.history-item .hi-result input { font-size:12px; padding:3px 8px; border:0.5px solid #ccc;
  border-radius:6px; width:120px; height:28px; }
.history-item .hi-result button { font-size:11px; padding:3px 10px; border-radius:6px;
  border:0.5px solid #97C459; background:#EAF3DE; color:#27500A; cursor:pointer; height:28px; }
.history-item .hi-saved { font-size:11px; color:#3B6D11; margin-left:4px; }
.history-item .hi-accuracy { font-size:11px; padding:2px 8px; border-radius:99px; margin-left:6px; }
.hi-hit { background:#EAF3DE; color:#27500A; }
.hi-miss { background:#f5f4ef; color:#888; }
.accuracy-summary { background:#fff; border-radius:10px; padding:12px 14px; margin-bottom:10px;
  border:0.5px solid rgba(0,0,0,0.1); display:flex; gap:16px; flex-wrap:wrap; }
.acc-block { text-align:center; }
.acc-num { font-size:22px; font-weight:500; color:#1a1a18; }
.acc-label { font-size:11px; color:#888; margin-top:2px; }
.hi-del { font-size:11px; color:#ccc; cursor:pointer; background:none; border:none; padding:0; }
.hi-del:hover { color:#A32D2D; }


/* マルチレース監視タブ */

/* パスワード画面 */
.pw-screen { display:none; position:fixed; top:0; left:0; right:0; bottom:0;
  background:#f5f4ef; z-index:9999; align-items:center; justify-content:center; }
.pw-screen.show { display:flex; }
.pw-box { background:#fff; border-radius:16px; padding:32px; width:90%; max-width:360px;
  border:0.5px solid rgba(0,0,0,0.1); text-align:center; }
.pw-logo { font-size:32px; margin-bottom:12px; }
.pw-title { font-size:16px; font-weight:500; margin-bottom:4px; }
.pw-sub { font-size:12px; color:#888; margin-bottom:20px; }
.pw-input { width:100%; font-size:14px; padding:10px 14px; border:0.5px solid #ccc;
  border-radius:10px; margin-bottom:10px; text-align:center; letter-spacing:2px; }
.pw-input:focus { outline:none; border-color:#1a1a18; }
.pw-btn { width:100%; font-size:14px; padding:10px; border-radius:10px; border:none;
  background:#1a1a18; color:#fff; cursor:pointer; font-weight:500; }
.pw-btn:hover { opacity:0.85; }
.pw-err { font-size:12px; color:#A32D2D; margin-top:8px; display:none; }

.monitor-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; align-items:center; }
.monitor-tab { font-size:12px; padding:5px 12px; border-radius:99px; border:0.5px solid #ccc;
  cursor:pointer; background:#fff; color:#666; position:relative; white-space:nowrap; }
.monitor-tab.active { background:#1a1a18; color:#fff; border-color:#1a1a18; }
.monitor-tab.hot { border-color:#E24B4A; color:#A32D2D; animation:tabpulse 1s infinite; }
.monitor-tab.hot.active { background:#A32D2D; color:#fff; border-color:#A32D2D; }
@keyframes tabpulse { 0%,100%{opacity:1} 50%{opacity:0.7} }
.monitor-tab .tab-close { margin-left:6px; font-size:11px; color:#aaa; }
.monitor-tab:hover .tab-close { color:#666; }
.btn-add-monitor { font-size:12px; padding:5px 10px; border-radius:99px; border:1.5px dashed #ccc;
  cursor:pointer; background:transparent; color:#888; }
.btn-add-monitor:hover { border-color:#888; color:#444; }

.loading { text-align:center; color:#888; padding:16px; font-size:13px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
</head>
<body>

<!-- パスワード画面 -->
<div class="pw-screen" id="pwScreen">
  <div class="pw-box">
    <div class="pw-logo">🏇</div>
    <div class="pw-title">地方競馬 オッズモニター</div>
    <div class="pw-sub">アクセスキーを入力してください</div>
    <input class="pw-input" type="password" id="pwInput" placeholder="••••••••"
      onkeydown="if(event.key==='Enter')checkPassword()"/>
    <button class="pw-btn" onclick="checkPassword()">ログイン</button>
    <div class="pw-err" id="pwErr">アクセスキーが違います</div>
  </div>
</div>

<h1>🏇 地方競馬 オッズ下降モニター</h1>

<!-- レース選択 -->
<div class="sec">開催レース選択</div>
<div class="card">
  <div class="date-row">
    <input type="date" id="dateInput"/>
    <button class="btn-sm" onclick="loadRaces()">レース一覧を読み込む</button>
  </div>
  <div id="venueTabs" class="venue-tabs"></div>
  <div id="raceGrid" class="race-grid"><div class="loading">日付を選んで「レース一覧を読み込む」を押してください</div></div>
</div>

<!-- 式別・フィルタ -->
<div class="sec">式別</div>
<div class="bet-tabs">
  <button class="bet-tab active" data-type="tan"        onclick="setBet(this)">単勝</button>
  <button class="bet-tab"        data-type="umaren"     onclick="setBet(this)">馬連</button>
  <button class="bet-tab"        data-type="umatan"     onclick="setBet(this)">馬単</button>
  <button class="bet-tab"        data-type="wide"       onclick="setBet(this)">ワイド</button>
  <button class="bet-tab"        data-type="sanrenfuku" onclick="setBet(this)">三連複</button>
  <button class="bet-tab"        data-type="sanrentan"  onclick="setBet(this)">三連単</button>
</div>
<div class="filter-row">
  <label>フィルタ</label>
  <select id="threshSelect" style="height:28px;font-size:12px;">
    <option value="0">全て（下降のみ）</option>
    <option value="5">5%以上下降</option>
    <option value="10" selected>10%以上下降</option>
    <option value="20">20%以上下降</option>
  </select>
  <label>📉連続</label>
  <select id="consecutiveFilter" style="height:28px;font-size:12px;">
    <option value="0">指定なし</option>
    <option value="2">2回以上連続</option>
    <option value="3">3回以上連続</option>
  </select>
  <label>🚨</label>
  <select id="alertThresh" style="height:28px;font-size:12px;">
    <option value="20" selected>20%以上</option>
    <option value="30">30%以上</option>
    <option value="50">50%以上</option>
  </select>
</div>

<!-- タイマー -->

<!-- マルチレース監視 -->
<div class="sec">監視中のレース</div>
<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;">
  <div class="monitor-tabs" id="monitorTabs"></div>
  
</div>
<div class="sec">タイマー</div>
<div class="card">
  <div class="timer-row">
    <div class="timer-block"><div class="timer-label">発走まで</div><div class="timer-val" id="tMain">--:--</div></div>
    <div class="timer-block"><div class="timer-label">自動取得開始まで</div><div class="timer-val" id="t20">--:--</div></div>
    <div class="timer-block"><div class="timer-label">締切まで</div><div class="timer-val" id="t5">--:--</div></div>
    <div class="timer-block"><div class="timer-label">取得回数</div><div class="timer-val" id="fetchCount">0</div></div>
  </div>
</div>

<div class="btn-row">
  <button class="btn start" id="btnStart" onclick="startAuto()">▶ 自動取得 開始</button>
  <button class="btn stop"  id="btnStop"  onclick="stopAuto()" disabled>■ 停止</button>
  <button class="btn now"   onclick="doFetch('手動')">今すぐ取得</button>
</div>
<div id="statusBar" class="status s-idle">レースを選んで「▶ 自動取得 開始」を押してください</div>

<div class="alert-banner" id="alertBanner"><div class="at">🚨 急落を検知</div><div class="al" id="alertList"></div></div>
<div id="raceName" class="race-name" style="display:none"></div>
<div id="raceMeta" class="race-meta" style="display:none"></div>
<table id="mainTable" style="display:none"><thead id="thead"></thead><tbody id="tbody"></tbody></table>
<div id="emptyState" class="empty" style="display:none">下降している組み合わせはありません</div>

<script>

// ===== パスワード認証 =====
const ACCESS_KEY = 'keibaoddsm';

function checkPassword() {
  const input = document.getElementById('pwInput').value;
  if (input === ACCESS_KEY) {
    localStorage.setItem('keiba_auth', ACCESS_KEY);
    document.getElementById('pwScreen').classList.remove('show');
    document.getElementById('pwErr').style.display = 'none';
    init();
  } else {
    document.getElementById('pwErr').style.display = 'block';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwInput').focus();
  }
}

function checkAuth() {
  const saved = localStorage.getItem('keiba_auth');
  if (saved === ACCESS_KEY) {
    init();
  } else {
    document.getElementById('pwScreen').classList.add('show');
    setTimeout(() => document.getElementById('pwInput').focus(), 100);
  }
}

function init() {
  // 既存の初期化処理
  renderMonitorTabs();
  loadRaces();
  }

// 起動時に認証チェック
document.addEventListener("DOMContentLoaded", checkAuth);

const BET_URL  ={tan:'OddsTanFuku',umaren:'OddsUmLenFuku',umatan:'OddsUmLenTan',wide:'OddsWide',sanrenfuku:'Odds3LenFuku',sanrentan:'Odds3LenTan'};
const BET_LABEL={tan:'単勝',umaren:'馬連',umatan:'馬単',wide:'ワイド',sanrenfuku:'三連複',sanrentan:'三連単'};

let currentBet='tan', oddsHistory={}, latestData=[], fetchCnt=0;
let isAuto=false, auto20done=false, auto5done=false;
let selectedBaba=null, selectedRno=null, selectedTime=null;
let venuesData=[];

// 今日の日付セット
const td=new Date();
document.getElementById('dateInput').value=
  `${td.getFullYear()}-${String(td.getMonth()+1).padStart(2,'0')}-${String(td.getDate()).padStart(2,'0')}`;

// 起動時の自動読み込みはinit()で行う

async function loadRaces() {
  const date = document.getElementById('dateInput').value.replace(/-/g,'/');
  document.getElementById('raceGrid').innerHTML='<div class="loading">読み込み中...</div>';
  document.getElementById('venueTabs').innerHTML='';

  try {
    const res  = await fetch(`/api/races?date=${encodeURIComponent(date)}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    venuesData = data.venues;
    if (!venuesData.length) {
      document.getElementById('raceGrid').innerHTML='<div class="loading">本日の開催情報がありません</div>';
      return;
    }
    renderVenueTabs(venuesData);
    selectVenue(venuesData[0]);
  } catch(e) {
    document.getElementById('raceGrid').innerHTML=`<div class="loading">読み込み失敗: ${e.message}</div>`;
  }
}

function renderVenueTabs(venues) {
  const tabs = document.getElementById('venueTabs');
  tabs.innerHTML = venues.map((v,i)=>
    `<button class="venue-tab${i===0?' active':''}" onclick="selectVenueByIndex(${i},this)">${v.babaName}</button>`
  ).join('');
}

function selectVenueByIndex(i, el) {
  document.querySelectorAll('.venue-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  selectVenue(venuesData[i]);
}

function selectVenue(venue) {
  const now = new Date();
  const grid = document.getElementById('raceGrid');
  grid.innerHTML = venue.races.map(r => {
    const [h,m] = r.time.split(':').map(Number);
    const raceDate = new Date(document.getElementById('dateInput').value);
    raceDate.setHours(h,m,0,0);
    const isDone = raceDate < now;
    const isActive = selectedBaba==venue.babaCode && selectedRno==r.rno;
    return `<div class="race-card${r.special?' special':''}${isDone?' done':''}${isActive?' active':''}"
      onclick="selectRace('${venue.babaCode}','${venue.babaName}',${r.rno},'${r.time}',this)">
      <div class="rno">${r.rno}R</div>
      <div class="rtime">${r.time}</div>
    </div>`;
  }).join('');
}

function selectRace(babaCode, babaName, rno, time, el) {
  selectedBaba = babaCode;
  selectedRno  = rno;
  selectedTime = time;
  document.querySelectorAll('.race-card').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');

  // タイマーセット
  const date = document.getElementById('dateInput').value;
  const [h,m] = time.split(':').map(Number);
  window._startMs = new Date(date).setHours(h,m,0,0);

  // 既に監視中か確認
  const exists = monitors.find(mo => mo.babaCode===babaCode && mo.rno===rno && mo.bet===currentBet);
  if (exists) {
    activeMonitorIdx = monitors.indexOf(exists);
    switchMonitor(activeMonitorIdx);
    setStatus(`${babaName} ${rno}R（${time}発走）に切り替えました`, 's-idle');
  } else {
    // 自動で監視リストに追加
    resetData();
    const monitor = {
      babaCode, babaName, rno, time,
      raceName: `${babaName} ${rno}R`,
      bet: currentBet,
      oddsHistory: {}, latestData: [], fetchCnt: 0,
      isHotFlag: false, auto20done: false, auto5done: false, lastAutoFetch: 0,
    };
    monitors.push(monitor);
    activeMonitorIdx = monitors.length - 1;
    renderMonitorTabs();
    setStatus(`${babaName} ${rno}R（${time}発走）を監視に追加しました`, 's-idle');
  }
}

function buildKeibaUrl() {
  if (!selectedBaba || !selectedRno) return null;
  const date = document.getElementById('dateInput').value.replace(/-/g,'/');
  return `https://www.keiba.go.jp/KeibaWeb/TodayRaceInfo/${BET_URL[currentBet]}?k_raceDate=${encodeURIComponent(date)}&k_raceNo=${selectedRno}&k_babaCode=${selectedBaba}`;
}

function setBet(el) {
  currentBet=el.dataset.type;
  document.querySelectorAll('.bet-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  resetData();
}

function resetData() {
  oddsHistory={}; latestData=[]; fetchCnt=0;
  auto20done=false; auto5done=false;
  document.getElementById('fetchCount').textContent='0';
  document.getElementById('mainTable').style.display='none';
  document.getElementById('emptyState').style.display='none';
  document.getElementById('alertBanner').classList.remove('show');
  document.getElementById('raceName').style.display='none';
  document.getElementById('raceMeta').style.display='none';
}

function fmt(ms){if(ms<=0)return'00:00';const s=Math.floor(ms/1000),m=Math.floor(s/60);return`${String(m).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}

function tick(){
  const startMs=window._startMs; if(!startMs) return;
  const now=Date.now(),diff=startMs-now,d20=diff-20*60000,d5=diff-5*60000;
  const mEl=document.getElementById('tMain');
  mEl.textContent=diff<=0?'発走済':fmt(diff);
  mEl.className='timer-val'+(diff<=0?' done':diff<5*60000?' alrt':diff<10*60000?' warn':'');
  const e20=document.getElementById('t20');
  e20.textContent=d20<=0?'✓ 済':fmt(d20);
  e20.className='timer-val'+(d20<=0?' done':d20<60000?' warn':'');
  const e5=document.getElementById('t5');
  e5.textContent=d5<=0?'✓ 済':fmt(d5);
  e5.className='timer-val'+(d5<=0?' done':d5<60000?' alrt':d5<3*60000?' warn':'');
  if(isAuto){
    if(!auto20done&&d20<=0&&diff>0){auto20done=true;doFetch('20分前 自動');playAlert();}
    if(!auto5done &&d5 <=0&&diff>0){auto5done =true;doFetch('5分前 自動'); playAlert();}
  }
}

function playAlert(){
  try{
    const ctx=new AudioContext();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value=880; gain.gain.value=0.3;
    osc.start(); osc.stop(ctx.currentTime+0.3);
  }catch(e){}
}

function startAuto(){
  if(!selectedBaba){setStatus('先にレースを選んでください','s-err');return;}
  isAuto=true; _lastAutoFetch=0; resetData();
  document.getElementById('btnStart').disabled=true;
  document.getElementById('btnStop').disabled=false;
  setStatus('自動取得モード稼働中 — 発走20分前から1分ごとに自動取得します','s-run');
}
function stopAuto(){
  isAuto=false;
  document.getElementById('btnStart').disabled=false;
  document.getElementById('btnStop').disabled=true;
  setStatus('停止しました','s-idle');
}

async function doFetch(label){
  const url=buildKeibaUrl();
  if(!url){setStatus('先にレースを選んでください','s-err');return;}
  setStatus(`取得中... (${label})`,'s-run');
  try{
    const res=await fetch(`/api/odds?url=${encodeURIComponent(url)}`);
    if(!res.ok)throw new Error(`HTTP ${res.status}`);
    const data=await res.json();
    if(data.error)throw new Error(data.error);
    if(!data.items||!data.items.length)throw new Error('オッズデータなし（発売前の可能性）');

    data.items.forEach(it=>{
      if(!oddsHistory[it.key])oddsHistory[it.key]=[];
      oddsHistory[it.key].push(it.odds);
      if(oddsHistory[it.key].length>8)oddsHistory[it.key].shift();
    });
    latestData=data.items; fetchCnt++;
    document.getElementById('fetchCount').textContent=fetchCnt;
    document.getElementById('raceName').textContent=data.race||'';
    document.getElementById('raceName').style.display='block';
    document.getElementById('raceMeta').textContent=`【${BET_LABEL[currentBet]}】${data.time}　取得: ${new Date().toLocaleTimeString('ja')}（${label}）`;
    document.getElementById('raceMeta').style.display='block';
    setStatus(`✓ 取得完了（${label}）— ${data.items.length}件　${fetchCnt}回目`,'s-run');
    renderTable();
  }catch(e){setStatus(`❌ 取得失敗: ${e.message}`,'s-err');}
}

function isConsecutiveDown(hist, n) {
  if (hist.length < n + 1) return false;
  for (let i = hist.length - n; i < hist.length; i++) {
    if (hist[i] >= hist[i-1]) return false;
  }
  return true;
}



// ===== マルチレース監視 =====
let monitors = []; // [{babaCode, babaName, rno, time, raceName, bet, oddsHistory, latestData, fetchCnt, isHot}]
let activeMonitorIdx = 0;

function addCurrentRaceToMonitor() {
  if (!selectedBaba || !selectedRno) {
    setStatus('先にレースを選んでください', 's-err');
    return;
  }
  // 重複チェック
  const exists = monitors.find(m => m.babaCode===selectedBaba && m.rno===selectedRno && m.bet===currentBet);
  if (exists) {
    setStatus('すでに監視中のレースです', 's-err');
    return;
  }
  const monitor = {
    babaCode: selectedBaba,
    babaName: venuesData.find(v=>v.babaCode===selectedBaba)?.babaName || selectedBaba,
    rno: selectedRno,
    time: selectedTime,
    raceName: document.getElementById('raceName').textContent || `${selectedRno}R`,
    bet: currentBet,
    oddsHistory: {},
    latestData: [],
    fetchCnt: 0,
    isHotFlag: false,
    auto20done: false,
    auto5done: false,
    lastAutoFetch: 0,
  };
  monitors.push(monitor);
  activeMonitorIdx = monitors.length - 1;
  renderMonitorTabs();
  switchMonitor(activeMonitorIdx);
  setStatus(`${monitor.babaName} ${monitor.rno}Rを監視に追加しました`, 's-run');
}

function renderMonitorTabs() {
  const tabs = document.getElementById('monitorTabs');
  if (!monitors.length) {
    tabs.innerHTML = '<span style="font-size:12px;color:#aaa">レースを選んで「＋ 追加」してください</span>';
    return;
  }
  tabs.innerHTML = monitors.map((m,i) => `
    <button class="monitor-tab${i===activeMonitorIdx?' active':''}${m.isHotFlag?' hot':''}"
      onclick="switchMonitor(${i})">
      ${m.isHotFlag?'🔥 ':''}${m.babaName} ${m.rno}R
      <span class="tab-close" onclick="removeMonitor(event,${i})">✕</span>
    </button>
  `).join('');
}

function switchMonitor(idx) {
  if (idx < 0 || idx >= monitors.length) return;
  activeMonitorIdx = idx;
  const m = monitors[idx];
  // 現在の表示をそのモニターに切り替え
  selectedBaba = m.babaCode;
  selectedRno  = m.rno;
  selectedTime = m.time;
  currentBet   = m.bet;
  oddsHistory  = m.oddsHistory;
  latestData   = m.latestData;
  fetchCnt     = m.fetchCnt;
  // 式別タブ更新
  document.querySelectorAll('.bet-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.type === m.bet);
  });
  // タイマーリセット
  const date = document.getElementById('dateInput').value;
  if (m.time) {
    const [h,mm] = m.time.split(':').map(Number);
    window._startMs = new Date(date).setHours(h,mm,0,0);
  }
  document.getElementById('fetchCount').textContent = m.fetchCnt;
  document.getElementById('raceName').textContent   = m.raceName || '';
  document.getElementById('raceName').style.display = m.raceName ? 'block' : 'none';
  renderMonitorTabs();
  renderTable();
}

function removeMonitor(e, idx) {
  e.stopPropagation();
  monitors.splice(idx, 1);
  if (activeMonitorIdx >= monitors.length) activeMonitorIdx = monitors.length - 1;
  if (monitors.length > 0) switchMonitor(activeMonitorIdx);
  else {
    oddsHistory = {}; latestData = []; fetchCnt = 0;
    document.getElementById('mainTable').style.display = 'none';
    document.getElementById('emptyState').style.display = 'none';
  }
  renderMonitorTabs();
}

// 全監視レースを一括自動取得
async function fetchAllMonitors() {
  const date = document.getElementById('dateInput').value.replace(/-/g,'/');
  await Promise.all(monitors.map(async (m, idx) => {
    const url = `https://www.keiba.go.jp/KeibaWeb/TodayRaceInfo/${BET_URL[m.bet]}?k_raceDate=${encodeURIComponent(date)}&k_raceNo=${m.rno}&k_babaCode=${m.babaCode}`;
    try {
      const res  = await fetch(`/api/odds?url=${encodeURIComponent(url)}`);
      const data = await res.json();
      if (data.error || !data.items?.length) return;
      data.items.forEach(it => {
        if (!m.oddsHistory[it.key]) m.oddsHistory[it.key] = [];
        m.oddsHistory[it.key].push(it.odds);
        if (m.oddsHistory[it.key].length > 8) m.oddsHistory[it.key].shift();
      });
      m.latestData = data.items;
      m.fetchCnt++;
      m.raceName = data.race || m.raceName;
      // hot判定
      const hotFound = data.items.some(it => {
        const h = m.oddsHistory[it.key];
        return h && isHot(h);
      });
      if (hotFound && !m.isHotFlag) {
        m.isHotFlag = true;
        playAlert();
      }
      // アクティブなモニターなら表示更新
      if (idx === activeMonitorIdx) {
        oddsHistory = m.oddsHistory;
        latestData  = m.latestData;
        fetchCnt    = m.fetchCnt;
        document.getElementById('fetchCount').textContent = m.fetchCnt;
        document.getElementById('raceName').textContent   = m.raceName;
        document.getElementById('raceName').style.display = 'block';
        document.getElementById('raceMeta').textContent   =
          `【${BET_LABEL[m.bet]}】${data.time}　取得: ${new Date().toLocaleTimeString('ja')}（自動）`;
        document.getElementById('raceMeta').style.display = 'block';
        renderTable();
      }
    } catch(e) {}
  }));
  renderMonitorTabs();
}


// ===== 履歴機能 =====
function saveHotSignal(raceName, betType, signals) {
  if (!signals.length) return;
  const key = 'keiba_history';
  let history = [];
  try { history = JSON.parse(localStorage.getItem(key) || '[]'); } catch(e) {}
  
  const now = new Date();
  const entry = {
    id: Date.now(),
    date: now.toLocaleDateString('ja-JP'),
    time: now.toLocaleTimeString('ja-JP', {hour:'2-digit',minute:'2-digit'}),
    raceName,
    betType,
    signals,
    result: '',
    hit: null
  };
  history.unshift(entry);
  if (history.length > 50) history = history.slice(0, 50);
  localStorage.setItem(key, JSON.stringify(history));
  renderHistory();
}

function loadHistory() {
  try { return JSON.parse(localStorage.getItem('keiba_history') || '[]'); } catch(e) { return []; }
}

function saveResult(id, result) {
  const history = loadHistory();
  const entry = history.find(h => h.id === id);
  if (!entry) return;
  entry.result = result;
  // 🔥シグナルの馬番が結果に含まれているか判定
  const signalKeys = entry.signals.map(s => s.key);
  const hit = signalKeys.some(k => result.includes(k.split('-')[0]));
  entry.hit = hit;
  localStorage.setItem('keiba_history', JSON.stringify(history));
  renderHistory();
}

function deleteHistory(id) {
  const history = loadHistory().filter(h => h.id !== id);
  localStorage.setItem('keiba_history', JSON.stringify(history));
  renderHistory();
}

function toggleHistory() {
  const panel = document.getElementById('historyPanel');
  panel.classList.toggle('show');
  if (panel.classList.contains('show')) renderHistory();
}

function renderHistory() {
  const history = loadHistory();
  const list = document.getElementById('historyList');
  const empty = document.getElementById('historyEmpty');
  const summary = document.getElementById('accuracySummary');

  if (!history.length) {
    list.innerHTML = '';
    empty.style.display = 'block';
    summary.innerHTML = '';
    return;
  }
  empty.style.display = 'none';

  // 精度集計
  const rated = history.filter(h => h.hit !== null);
  const hits  = rated.filter(h => h.hit).length;
  const hitRate = rated.length ? Math.round(hits/rated.length*100) : 0;
  summary.innerHTML = `
    <div class="acc-block"><div class="acc-num">${history.length}</div><div class="acc-label">総シグナル数</div></div>
    <div class="acc-block"><div class="acc-num">${rated.length}</div><div class="acc-label">結果入力済</div></div>
    <div class="acc-block"><div class="acc-num" style="color:${hitRate>=50?'#3B6D11':'#A32D2D'}">${hitRate}%</div><div class="acc-label">🔥的中率</div></div>
    <div class="acc-block"><div class="acc-num">${hits}</div><div class="acc-label">的中数</div></div>
  `;

  list.innerHTML = history.map(h => `
    <div class="history-item">
      <div class="hi-header">
        <div class="hi-title">${h.raceName} <span style="font-size:11px;color:#888;font-weight:400">[${h.betType}]</span></div>
        <div style="display:flex;align-items:center;gap:8px;">
          <div class="hi-date">${h.date} ${h.time}</div>
          <button class="hi-del" onclick="deleteHistory(${h.id})">✕</button>
        </div>
      </div>
      <div class="hi-signals">
        ${h.signals.map(s=>`🔥 ${s.label}：${s.history.join(' → ')}（-${s.totalPct}%）`).join('<br>')}
      </div>
      <div class="hi-result">
        <input type="text" placeholder="結果入力（例: 3-1-4）" value="${h.result||''}"
          id="result_${h.id}" onkeydown="if(event.key==='Enter')saveResult(${h.id},this.value)"/>
        <button onclick="saveResult(${h.id},document.getElementById('result_${h.id}').value)">保存</button>
        ${h.hit!==null ? `<span class="hi-accuracy ${h.hit?'hi-hit':'hi-miss'}">${h.hit?'✓ 的中':'✗ 不的中'}</span>` : ''}
      </div>
    </div>
  `).join('');
}

// renderTableでhot検知時に自動保存
function autoSaveHotSignals() {
  if (!latestData.length) return;
  const hotSignals = latestData
    .filter(it => {
      const hist = oddsHistory[it.key];
      return hist && hist.length >= 2 && isHot(hist);
    })
    .map(it => {
      const hist = oddsHistory[it.key];
      const totalPct = ((hist[0]-hist[hist.length-1])/hist[0]*100).toFixed(1);
      return { key:it.key, label:it.label, history:hist.map(v=>v.toFixed(1)), totalPct };
    });
  if (hotSignals.length > 0) {
    const raceName = document.getElementById('raceName').textContent || 'レース不明';
    saveHotSignal(raceName, BET_LABEL[currentBet], hotSignals);
  }
}

function isHot(hist) {
  if (hist.length < 2) return false;
  // 直近1回で10%以上急落
  const last = (hist[hist.length-2] - hist[hist.length-1]) / hist[hist.length-2] * 100;
  if (last >= 10) return true;
  // 直近3回で合計15%以上下落
  if (hist.length >= 4) {
    const total = (hist[hist.length-4] - hist[hist.length-1]) / hist[hist.length-4] * 100;
    if (total >= 15) return true;
  }
  return false;
}

let _chartInstance = null;
function showChart(key, label) {
  const hist = oddsHistory[key];
  if (!hist || hist.length < 2) return;
  const hot = isHot(hist);
  document.getElementById('modalTitle').innerHTML =
    label + (hot ? '<span class="hot-badge">🔥 急落中</span>' : '');
  const pct = ((hist[0] - hist[hist.length-1]) / hist[0] * 100).toFixed(1);
  document.getElementById('modalMeta').textContent =
    `取得${hist.length}回　${hist[0].toFixed(1)} → ${hist[hist.length-1].toFixed(1)}（合計 -${pct}%）`;
  if (_chartInstance) _chartInstance.destroy();
  const ctx = document.getElementById('modalChart').getContext('2d');
  const color = hot ? '#E24B4A' : '#185FA5';
  _chartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: hist.map((_,i) => `${i+1}回目`),
      datasets: [{
        label: 'オッズ',
        data: hist,
        borderColor: color,
        backgroundColor: hot ? 'rgba(226,75,74,0.08)' : 'rgba(24,95,165,0.08)',
        borderWidth: 2.5,
        pointRadius: 5,
        pointBackgroundColor: color,
        tension: 0.3,
        fill: true,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: {
          reverse: false,
          ticks: { font: { size: 11 } }
        },
        x: { ticks: { font: { size: 11 } } }
      }
    }
  });
  document.getElementById('chartModal').classList.add('show');
}

function closeModal(e) {
  if (e.target.id === 'chartModal') {
    document.getElementById('chartModal').classList.remove('show');
  }
}

function pctChange(h){if(h.length<2)return 0;return(h[h.length-1]-h[h.length-2])/h[h.length-2]*100;}
function sparkline(hist,isAlert){
  if(hist.length<2)return'<span style="color:#aaa;font-size:11px">-</span>';
  const max=Math.max(...hist),min=Math.min(...hist),range=max-min||1,col=isAlert?'#3B6D11':'#639922';
  return hist.map((v,i)=>{const h=Math.max(4,Math.round(((v-min)/range)*18)+4);return`<div class="sb" style="height:${h}px;background:${col};opacity:${i===hist.length-1?1:.35}"></div>`;}).join('');
}

function renderTable(){
  const thresh=parseFloat(document.getElementById('threshSelect').value),
        aThresh=parseFloat(document.getElementById('alertThresh').value),
        isTan=currentBet==='tan',
        tbody=document.getElementById('tbody'),
        thead=document.getElementById('thead');
  tbody.innerHTML='';
  thead.innerHTML=isTan
    ?'<tr><th>馬番</th><th>馬名</th><th>前回</th><th>現在</th><th></th><th>下降率</th><th>推移</th></tr>'
    :'<tr><th>組合せ</th><th>前回</th><th>現在</th><th></th><th>下降率</th><th>推移</th></tr>';

  const rows=latestData.map(it=>{
    const hist=oddsHistory[it.key]||[it.odds],cur=hist[hist.length-1],prev=hist.length>=2?hist[hist.length-2]:null,p=prev!==null?pctChange(hist):0;
    return{it,hist,cur,prev,p};
  }).filter(r=>{
      if(r.p>=-0.4||Math.abs(r.p)<thresh) return false;
      const consec=parseInt(document.getElementById('consecutiveFilter').value);
      if(consec>0 && !isConsecutiveDown(r.hist, consec)) return false;
      return true;
    }).sort((a,b)=>a.p-b.p);

  const alerts=rows.filter(r=>r.p<=-aThresh);
  const banner=document.getElementById('alertBanner');
  const hotItems = rows.filter(r => isHot(r.hist));
  if(hotItems.length) { playAlert(); autoSaveHotSignals(); }
  if(alerts.length){
    banner.classList.add('show');
    document.getElementById('alertList').innerHTML=alerts.map(r=>`${r.it.label}：${r.p.toFixed(1)}%（${r.prev.toFixed(1)} → ${r.cur.toFixed(1)}）`).join('<br>');
    playAlert();
  } else { banner.classList.remove('show'); }

  if(!rows.length){document.getElementById('mainTable').style.display='none';document.getElementById('emptyState').style.display='block';return;}
  document.getElementById('mainTable').style.display='table';
  document.getElementById('emptyState').style.display='none';

  rows.forEach(({it,hist,cur,prev,p})=>{
    const isAlert=p<=-aThresh,mark=isAlert?' 🚨':'',tr=document.createElement('tr');
    const hot = isHot(hist);
    tr.className = hot ? 'ar hot-row' : (isAlert ? 'ar' : '');
    if(isTan){
      const[num,...rest]=it.label.split(' ');
      tr.innerHTML=`<td><span class="nb${isAlert?' a':''}">${num}</span></td><td class="${isAlert?'hl':''}">${rest.join(' ')}${mark}</td><td style="color:#888">${prev!==null?prev.toFixed(1):'-'}</td><td class="${isAlert?'hl':''}" style="font-weight:500">${cur.toFixed(1)}</td><td><span class="badge ${isAlert?'bda':'bd'}">↓</span></td><td class="${isAlert?'pda':'pd'}">${prev!==null?p.toFixed(1)+'%':'-'}</td><td><div class="spark">${sparkline(hist,isAlert)}</div></td>`;
    }else{
      tr.innerHTML=`<td><span class="nb${isAlert?' a':''}" style="padding:0 5px">${it.label}${mark}</span></td><td style="color:#888">${prev!==null?prev.toFixed(1):'-'}</td><td class="${isAlert?'hl':''}" style="font-weight:500">${cur.toFixed(1)}</td><td><span class="badge ${isAlert?'bda':'bd'}">↓</span></td><td class="${isAlert?'pda':'pd'}">${prev!==null?p.toFixed(1)+'%':'-'}</td><td><div class="spark">${sparkline(hist,isAlert)}</div></td>`;
    }
    tbody.appendChild(tr);
  });
}

function setStatus(msg,cls){const el=document.getElementById('statusBar');el.textContent=msg;el.className='status '+cls;}
document.getElementById('threshSelect').addEventListener('change',renderTable);
document.getElementById('alertThresh').addEventListener('change',renderTable);
document.getElementById('consecutiveFilter').addEventListener('change',renderTable);
</script>
